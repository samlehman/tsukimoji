[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "tsukimoji"
version = "0.1.2"
description = "Moon phase emoji for any date"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Sam Lehman", email = "grieve@gmail.com" }]
keywords = ["moon", "moon-phase", "emoji", "lunar", "astronomy"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Intended Audience :: Developers",
]

[project.urls]
Homepage = "https://github.com/samlehman/tsukimoji"

[tool.setuptools.packages.find]
where = ["src"]
